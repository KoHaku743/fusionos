set default=0
set timeout=5
set timeout_style=menu

# ── FusionOS GRUB2 Boot Menu ─────────────────────────────

menuentry "FusionOS (normal)" {
    insmod all_video
    insmod gfxterm
    insmod gzio
    insmod part_gpt
    insmod ext2
    insmod iso9660
    terminal_output gfxterm
    set gfxmode=auto

    linux   /boot/vmlinuz quiet splash console=ttyS0 console=tty0 \
            root=/dev/sr0 rootfstype=iso9660 ro \
            init=/sbin/init
    initrd  /boot/initrd
}

menuentry "FusionOS (verbose)" {
    insmod all_video
    insmod gfxterm
    insmod gzio
    insmod part_gpt
    insmod ext2
    insmod iso9660

    linux   /boot/vmlinuz console=ttyS0 console=tty0 \
            root=/dev/sr0 rootfstype=iso9660 ro \
            init=/sbin/init loglevel=7
    initrd  /boot/initrd
}

menuentry "FusionOS (recovery)" {
    insmod all_video
    insmod gfxterm
    insmod gzio
    insmod part_gpt
    insmod ext2
    insmod iso9660

    linux   /boot/vmlinuz console=ttyS0 console=tty0 \
            root=/dev/sr0 rootfstype=iso9660 ro \
            init=/sbin/init single loglevel=7
    initrd  /boot/initrd
}
