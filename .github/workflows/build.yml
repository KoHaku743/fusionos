name: FusionOS CI

on:
  push:
    branches: ["main"]
  pull_request:

# Minimal default permissions for all jobs — individual jobs can expand as needed.
permissions:
  contents: read

env:
  KERNEL_VERSION: "6.6"

jobs:
  # -------------------------------------------------------------------------
  # Job 1: compile all custom binaries and run unit tests
  # -------------------------------------------------------------------------
  build-compat-tools:
    name: Build & Test Compat Tools
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc make binutils file

      - name: Build all FusionOS C components
        run: |
          set -euo pipefail
          CC=gcc
          CFLAGS="-O2 -Wall -Wextra -Wpedantic -std=c11 -static"
          SRC=src
          OUT=build
          mkdir -p "${OUT}"

          echo "==> initramfs init"
          $CC $CFLAGS -o "${OUT}/initramfs_init" \
              "${SRC}/init/initramfs_init.c"

          echo "==> main init"
          $CC $CFLAGS -o "${OUT}/init" \
              "${SRC}/init/init.c"

          echo "==> fsh shell"
          $CC $CFLAGS -o "${OUT}/fsh" \
              "${SRC}/shell/shell.c" \
              "${SRC}/compat/detect.c"

          echo "==> fusion-run"
          $CC $CFLAGS -o "${OUT}/fusion-run" \
              "${SRC}/compat/fusion_run.c" \
              "${SRC}/compat/detect.c"

          echo "==> fusion-pkg"
          $CC $CFLAGS -o "${OUT}/fusion-pkg" \
              "${SRC}/pkg/fusion_pkg.c"

          echo "==> fusion-monitor"
          $CC $CFLAGS -o "${OUT}/fusion-monitor" \
              "${SRC}/monitor/monitor.c"

          echo "==> detect_test"
          $CC $CFLAGS -o "${OUT}/detect_test" \
              "${SRC}/compat/detect_test.c" \
              "${SRC}/compat/detect.c"

          echo "All binaries compiled successfully."

      - name: Verify all binaries are ELF executables
        run: |
          for bin in build/initramfs_init build/init build/fsh \
                     build/fusion-run build/fusion-pkg \
                     build/fusion-monitor build/detect_test; do
            echo -n "  ${bin}: "
            file "${bin}"
          done

      - name: Run unit tests
        run: |
          chmod +x tests/run_all.sh tests/test_detect.sh \
                   tests/test_shell.sh tests/test_build.sh
          tests/run_all.sh

  # -------------------------------------------------------------------------
  # Job 2: full ISO build — only on pushes to main
  # Note: update the branch name below if the default branch is renamed.
  # -------------------------------------------------------------------------
  build-iso:
    name: Build ISO
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache kernel source tarball
        uses: actions/cache@v4
        with:
          path: build/linux-${{ env.KERNEL_VERSION }}.tar.xz
          key: kernel-${{ env.KERNEL_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc make binutils file wget xz-utils bzip2 cpio gzip \
            bc flex bison libssl-dev libelf-dev \
            grub-pc-bin grub-efi-amd64-bin grub-common \
            xorriso mtools

      - name: Build FusionOS ISO
        run: ./build.sh all

      - name: Upload ISO artefact
        uses: actions/upload-artifact@v4
        with:
          name: fusionos-iso
          path: build/fusionos.iso
          retention-days: 7
