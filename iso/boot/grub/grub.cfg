# FusionOS GRUB2 Configuration
# Kernel 6.6 LTS + BusyBox initramfs + custom compat layer

set default=0
set timeout=5
set timeout_style=menu

# Set graphics mode for the menu
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=auto
    insmod gfxterm
    insmod vbe
    terminal_output gfxterm
fi

# Color scheme
set color_normal=white/black
set color_highlight=black/light-gray

# Menu entry: FusionOS (normal boot)
menuentry "FusionOS" --class os {
    insmod gzio
    insmod part_msdos
    insmod part_gpt
    insmod ext2
    insmod iso9660

    linux  /boot/vmlinuz quiet console=tty0 console=ttyS0,115200 init=/sbin/init
    initrd /boot/initrd
}

# Menu entry: FusionOS (verbose boot)
menuentry "FusionOS (verbose)" --class os {
    insmod gzio
    insmod part_msdos
    insmod part_gpt
    insmod ext2
    insmod iso9660

    linux  /boot/vmlinuz console=tty0 console=ttyS0,115200 init=/sbin/init
    initrd /boot/initrd
}

# Menu entry: FusionOS (serial console only)
menuentry "FusionOS (serial console)" --class os {
    insmod gzio
    insmod part_msdos
    insmod part_gpt
    insmod ext2
    insmod iso9660

    linux  /boot/vmlinuz quiet console=ttyS0,115200 init=/sbin/init
    initrd /boot/initrd
}

# Menu entry: FusionOS (memory test — Memtest86+)
menuentry "Memory Test (Memtest86+)" --class memtest86 {
    insmod multiboot
    module /boot/memtest86+.bin
}

# Reboot / Poweroff entries
menuentry "Reboot" {
    reboot
}

menuentry "Power Off" {
    halt
}
